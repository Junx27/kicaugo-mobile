# SonarCloud configuration for KicauGo mobile.
# Isi sonar.organization dan sonar.projectKey sesuai project di SonarCloud.
sonar.projectKey=YOUR_PROJECT_KEY
sonar.organization=YOUR_ORG

sonar.projectName=KicauGo Mobile
sonar.projectVersion=1.0.0

sonar.sources=lib
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Coverage dari flutter test --coverage
sonar.dart.lcov.reportPaths=coverage/lcov.info

# Abaikan file generated
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/generated/**
sonar.test.exclusions=**/*.g.dart
