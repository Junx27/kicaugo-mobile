# SonarCloud configuration for KicauGo mobile.
# organization dan projectKey mengikuti project SonarCloud KicauGo.
sonar.projectKey=Junx27_kicaugo-mobile
sonar.organization=junx27

sonar.projectName=KicauGo Mobile
sonar.projectVersion=1.0.0

sonar.sources=lib
sonar.tests=test
sonar.sourceEncoding=UTF-8

# Coverage dari flutter test --coverage
sonar.dart.lcov.reportPaths=coverage/lcov.info

# Test, entrypoint, dan kode native tidak masuk denominator coverage Flutter.
sonar.coverage.exclusions=test/**,test_driver/**,ios/**,lib/main.dart

# Abaikan file generated
sonar.exclusions=**/*.g.dart,**/*.freezed.dart,**/generated/**
sonar.test.exclusions=**/*.g.dart
